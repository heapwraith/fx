[workspace]
resolver = "3"
members = ["crates/*"]
# third_party/ holds vendored, patched crates (see docs/DECISIONS.md D-007).
exclude = ["third_party/*"]

[workspace.package]
version = "0.2.0-beta"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"   # docs/DECISIONS.md D-004
repository = "https://github.com/heapwraith/fx"
publish = false

# Toda dependência nova entra aqui com versão EXATA e é registrada em docs/DECISIONS.md.
# Bibliotecas de uso geral (thiserror, anyhow, crossbeam-channel, tempfile, serde...) entram
# com `cargo add <crate> --workspace`-style na tarefa que precisar, fixando a versão com "=".
[workspace.dependencies]
regex = "=1.13.2"
embed-resource = "=3.0.12"
fx-core = { path = "crates/fx-core" }
fx-fs = { path = "crates/fx-fs" }
fx-index = { path = "crates/fx-index" }
fx-shell = { path = "crates/fx-shell" }
fx-ops = { path = "crates/fx-ops" }
fx-theme = { path = "crates/fx-theme" }

ntfs-reader = "=0.4.6"
tempfile = "=3.27.0"

# Acessibilidade (T1.10, D-008, D-021): árvore neutra em fx-ui, adaptador UIA em fx-shell.
accesskit = "=0.25.2"
accesskit_windows = "=0.35.2"
# HWND da janela do GPUI (mesma versão que o GPUI já usa; D-021).
raw-window-handle = "=0.6.2"

# Persistência (T1.17, D-026): configurações em TOML, estado em SQLite (embutido).
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.8.23"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }

# GPUI: fixado na T0.1 (D-007). Resolvido para a cópia com patch em third_party/gpui
# via [patch.crates-io] abaixo, para compilar de forma cruzada WSL -> Windows (D-005).
gpui = "=0.2.2"

# Revisão de código (D-066): já compiladas como dependências do GPUI, agora diretas.
# Canais assíncronos (sem bloquear o pool de threads do Windows).
futures = "=0.3.34"
# Fachada de log: os avisos do GPUI e do fx vão para %LOCALAPPDATA%\fx\logs.
log = "=0.4.35"
# Tipos de erro nas bibliotecas (CLAUDE.md).
thiserror = "=2.0.21"

# Compactados (D-069): crates Rust puros, os mesmos no Windows e no Linux.
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
tar = { version = "=0.4.46", default-features = false }
sevenz-rust2 = { version = "=0.25.0", default-features = false }
bzip2 = "=0.6.1"
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz"] }

[workspace.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Compression",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # Publisher of a signed installer (WTHelper*, D-066).
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    # Image quick actions (WIC, T6.16).
    "Win32_Graphics_Imaging",
    "Win32_System_Com_StructuredStorage",
    "Win32_Networking_WinHttp",
]

[patch.crates-io]
gpui = { path = "third_party/gpui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"   # permite perfilar o build de release

[profile.bench]
inherits = "release"
