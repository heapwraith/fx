# Checks every push and pull request on Windows; a tag vX.Y.Z equal to the
# Cargo.toml version also publishes a draft release with the portable zip
# (task T2.2, docs/DECISIONS.md D-037). Locally the project is cross-compiled
# from WSL with cargo-xwin; here it builds natively with MSVC.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Only pull requests cancel an older run: every commit on main is checked on
# its own (a docs-only push used to cancel the check of the code before it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FX_NO_STATE: "1"

# Actions are pinned to a full commit SHA (GitHub's secure-use guidance: a tag
# can be moved); Dependabot proposes the updates (.github/dependabot.yml).
jobs:
  # Known vulnerabilities in the dependencies (RustSec; deny.toml).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories

  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Third-party notices up to date (tools/third-party-notices.py)
        shell: pwsh
        run: |
          python tools/third-party-notices.py
          git diff --exit-code -- THIRD-PARTY-NOTICES.txt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p fx-ui -p fx-indexd -p fx-preview -p fx-setup -p fx-setup-boot
      - name: Version of the build
        shell: pwsh
        run: (Get-Item target/x86_64-pc-windows-msvc/release/fx.exe).VersionInfo | Format-List FileVersion, ProductVersion
      - name: Installer (fx-setup, T4.3)
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $rel = "$PWD\target\x86_64-pc-windows-msvc\release"
          New-Item -ItemType Directory -Force dist | Out-Null
          & "$rel\fx-setup.exe" --pack "$rel\fx-setup-boot.exe" $rel $PWD "$PWD\dist\fx-$v-setup-x64.exe" | Out-Host
          if (-not (Test-Path "dist\fx-$v-setup-x64.exe")) { throw "fx-setup --pack failed" }
          # The package must install and uninstall cleanly (test folder and key).
          $root = "$env:RUNNER_TEMP\fx-setup-ci"
          Start-Process -Wait -FilePath "dist\fx-$v-setup-x64.exe" -ArgumentList "--silent","--test-root",$root
          if (-not (Test-Path "$root\Programs\fx\fx.exe")) { throw "silent install failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fx-setup
          path: dist/*-setup-x64.exe
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fx-exe
          path: |
            target/x86_64-pc-windows-msvc/release/fx.exe
            target/x86_64-pc-windows-msvc/release/fx-indexd.exe
            target/x86_64-pc-windows-msvc/release/fx-preview.exe
          retention-days: 14

  # ARM64 build (T3.6): cross-compiled on the x64 runner (MSVC ARM64 tools).
  arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: arm64
      - name: Build release (aarch64)
        run: cargo build --release --target aarch64-pc-windows-msvc -p fx-ui -p fx-indexd -p fx-preview -p fx-setup -p fx-setup-boot
      - name: Packer (x64 fx-setup, packs the ARM64 one)
        run: cargo build --release --target x86_64-pc-windows-msvc -p fx-setup
      - name: Installer (fx-setup, ARM64)
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $arm = "$PWD\target\aarch64-pc-windows-msvc\release"
          New-Item -ItemType Directory -Force dist | Out-Null
          & "$PWD\target\x86_64-pc-windows-msvc\release\fx-setup.exe" --pack "$arm\fx-setup-boot.exe" $arm $PWD "$PWD\dist\fx-$v-setup-arm64.exe" | Out-Host
          if (-not (Test-Path "dist\fx-$v-setup-arm64.exe")) { throw "fx-setup --pack failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fx-arm64
          path: |
            target/aarch64-pc-windows-msvc/release/fx.exe
            target/aarch64-pc-windows-msvc/release/fx-indexd.exe
            target/aarch64-pc-windows-msvc/release/fx-preview.exe
            dist/*-setup-arm64.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, arm64]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fx-exe
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fx-setup
          path: setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fx-arm64
          path: arm64
      - name: Tag must match Cargo.toml
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { throw "tag v$tag does not match Cargo.toml version $cargo" }
          "version=$cargo" >> $env:GITHUB_OUTPUT
      - name: Portable zip and release notes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath "fx-$v-windows-x64.zip"
          New-Item -ItemType Directory arm64zip | Out-Null
          Copy-Item arm64/target/aarch64-pc-windows-msvc/release/*.exe, LICENSE-MIT, LICENSE-APACHE, README.md, CHANGELOG.md arm64zip/
          Compress-Archive -Path arm64zip/* -DestinationPath "fx-$v-windows-arm64.zip"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $v" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $notes -join "`n" | Set-Content notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $setup = (Get-ChildItem setup/*-setup-x64.exe | Select-Object -First 1).FullName
          $setupArm = (Get-ChildItem -Recurse arm64 -Filter *-setup-arm64.exe | Select-Object -First 1).FullName
          # Checksums the updater checks the installers against (T4.1).
          $sums = foreach ($f in @("fx-$v-windows-x64.zip", "fx-$v-windows-arm64.zip", $setup, $setupArm)) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower(), (Split-Path $f -Leaf)
          }
          $sums | Set-Content -Encoding ascii SHA256SUMS.txt
          $ghArgs = @("${{ github.ref_name }}", "fx-$v-windows-x64.zip", "fx-$v-windows-arm64.zip", $setup, $setupArm, "SHA256SUMS.txt", "--draft", "--title", "fx $v", "--notes-file", "notes.md")
          if ($v.StartsWith('0.')) { $ghArgs += "--prerelease" }  # pre-1.0
          gh release create @ghArgs
